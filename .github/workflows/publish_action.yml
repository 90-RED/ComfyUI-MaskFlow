name: Publish to Comfy registry

# A version bump in pyproject.toml IS a release, so this runs on that change - and
# can also be started by hand from the Actions tab.
# If REGISTRY_ACCESS_TOKEN is not set, the publish step is skipped with a message
# and the run still SUCCEEDS, so a missing secret never shows a failing workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pyproject.toml

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == '90-RED' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Is a registry token configured?
        id: token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -n "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Custom Node
        if: steps.token.outputs.present == 'yes'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          pip install --quiet comfy-cli
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"

      - name: Nothing to do
        if: steps.token.outputs.present != 'yes'
        run: echo "REGISTRY_ACCESS_TOKEN is not set - skipping the publish step."
